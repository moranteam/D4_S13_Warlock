                          - listitem [ref=e730]:
                            - text: Focus on farming
                            - generic [ref=e732]: ‍Footfalls of the Waning World
                            - text: with Attacks Reduce Evade Cooldown and masterwork that stat for more frequent teleports.
                          - listitem [ref=e735]:
