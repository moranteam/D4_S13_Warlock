                          - listitem [ref=e709]:
                            - generic [ref=e711]: ‍Footfalls of the Waning World
                            - text: allows you to teleport much more frequently and constantly extend the duration of your Abyssal summons (
                            - generic [ref=e715]: ‍Abyssal Titan
                            - text: ","
                            - generic [ref=e719]: ‍Profane Sentinel
