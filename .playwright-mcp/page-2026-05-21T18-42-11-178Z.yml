                          - listitem [ref=e740]:
                            - generic [ref=e742]: ‍Aspect of Calamity
                            - text: provides a ton of Critical Strike Chance from the start, allowing to scale Critical Strike Damage Multiplier on gear. In the endgame, this is dropped as you can get 100% Crit Chance from gear alone.
                          - listitem [ref=e745]:
